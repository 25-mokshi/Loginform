<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Course Registration form</h1> 
    <form>
        <h1>Login </h1>
        <label>Name :</label><br>
        <input type="text" id="name" placeholder="Enter your name" required><br><br>
        <label>Email :</label><br>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>
        <label>Mobile :</label><br>
        <input type="tel" id="mobile" placeholder="Enter your mobile number" ><br><br>
        <label>Password :</label><br>
        <input type="password" id="password" placeholder="Enter your password" required><br><br>
        <button onclick="Login()">Submit</button>

    </form>
    <script>
        function Login() {
          

            if (document.getElementById("name").value === "" || document.getElementById("email").value === "" || document.getElementById("password").value === "") {
                alert("Enter valid name , email and password");
                return false;
            }

           

            alert("Login successful!");
        }
        </script>
</body>
</html>
